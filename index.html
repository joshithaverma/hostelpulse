<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>HostelPulse - CVR College of Engineering Hostels</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F0F3F8;--surf:#fff;--ink:#14202F;--mute:#5A6878;--line:#D5DCE6;--pri:#0B2F6B;--pri-ink:#fff;--soft:#E6ECF6;--hdr:#0B2F6B;--shadow:0 1px 2px rgba(15,30,60,.07),0 2px 10px rgba(15,30,60,.04);
  --ok:#1B6E3E;--ok-bg:#DCEFE3;--bad:#A8231B;--bad-bg:#F8DFDC;--warn:#8A5200;--warn-bg:#FAEBC9;--info:#44546A;--info-bg:#E3E8EE;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root{color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sub{color:var(--mute);font-size:14.5px}
.note{color:var(--mute);font-size:14.5px;margin-top:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--hdr);color:#fff;border-bottom:0}
.brand{font-weight:700;font-size:21px;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:13.5px;color:rgba(255,255,255,.8);margin-top:2px}
.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;font-size:14px}
.top .btn:hover{background:rgba(255,255,255,.24);border-color:#fff}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding:10px 22px 16px;background:var(--hdr);color:#fff;border-bottom:0}
.strip div{min-width:0}
.strip span{display:block;font-size:13.5px;color:rgba(255,255,255,.78)}
.strip b{font-weight:600;font-size:15.5px}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;color:#0B2F6B;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1340px;margin:0 auto;padding:22px}
nav.side{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow-y:auto}
nav.side button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:10px 14px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:15.5px}
nav.side button:hover{background:var(--soft)}
nav.side button[aria-current="page"]{background:var(--pri);color:var(--pri-ink);font-weight:600}
nav.side button .nl{display:flex;align-items:center;gap:12px}
.badge{min-width:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:13px;font-weight:600;text-align:center;line-height:22px}
[aria-current="page"] .badge{background:var(--pri-ink);color:var(--pri)}
main{min-width:0}
.head{margin-bottom:16px}
.head p{color:var(--mute);margin-top:2px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel>h2,.panel>h3{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols>.panel{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surf);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;min-height:42px;font-size:15px}
.btn:hover{border-color:var(--pri)}
.btn.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:5px 12px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;font-size:15.5px}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0;cursor:pointer;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-pri{background:var(--soft);color:var(--pri);border-color:var(--pri)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;position:relative;cursor:pointer}
.tile:hover{border-color:var(--pri)}
.tile.t-bad{border-left-color:var(--bad)}
.tile.t-warn{border-left-color:var(--warn)}
.tile.t-ok{border-left-color:var(--ok)}
.tile .ti{position:absolute;top:14px;right:14px;color:var(--mute);opacity:.6}
.tile .ti .ico{width:20px;height:20px}
.tile .l{display:block;font-size:14px;color:var(--mute);padding-right:26px}
.tile .v{display:block;font-size:28px;font-weight:700;line-height:1.2;margin:3px 0}
.tile .v.txt{font-size:17px;line-height:1.35;font-weight:600;margin:5px 0}
.tile .s{display:block;font-size:13px;color:var(--mute)}
.hero{border-left:6px solid var(--line)}
.hero.h-ok{border-left-color:var(--ok)}.hero.h-warn{border-left-color:var(--warn)}.hero.h-bad{border-left-color:var(--bad)}.hero.h-info{border-left-color:var(--info)}
.hero .big{font-size:25px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.quick .btn{justify-content:flex-start;min-height:50px;padding:12px 14px;box-shadow:var(--shadow)}
.list>*{padding:12px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0;padding-top:0}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 18px}
.item .main{flex:1 1 260px;min-width:0}
.item .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.line{margin-top:4px;color:var(--mute);font-size:15px}
.line b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500;font-size:15.5px}
.tab[aria-pressed="true"]{border-bottom-color:var(--pri);font-weight:700;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:6px;background:var(--info-bg);font-size:14px;cursor:pointer;border:1px solid transparent}
.chip.active{background:var(--pri);color:var(--pri-ink);font-weight:600}
.chip b{font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.tools .field{margin:0;min-width:140px;flex:1 1 140px}
.rc-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.rc-row .who{flex:1 1 200px}
.rc-row .who span{display:inline-block;margin-right:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-b{border:0;border-right:1px solid var(--line);background:var(--surf);padding:8px 14px;cursor:pointer;min-width:68px;min-height:40px;font-size:14px}
.seg-b:last-child{border-right:0}
.seg-b.on.s-P{background:var(--ok);color:#fff;font-weight:600}
.seg-b.on.s-A{background:var(--bad);color:#fff;font-weight:600}
.seg-b.on.s-O{background:var(--warn);color:#fff;font-weight:600}
.seg-b.on.s-L{background:var(--info);color:#fff;font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
thead th{background:var(--soft);font-weight:600;white-space:nowrap}
tbody tr:hover{background:var(--soft)}
.reg{font-size:13px;width:auto}
.reg th,.reg td{padding:0;text-align:center;border:1px solid var(--line);min-width:28px}
.reg tbody tr:hover{background:none}
.reg th.nm,.reg td.nm{position:sticky;left:0;background:var(--surf);text-align:left;padding:5px 10px;min-width:160px;z-index:1;white-space:nowrap;font-size:13.5px}
.reg thead th.nm{background:var(--soft)}
.reg th.today{background:var(--pri);color:var(--pri-ink)}
.reg td.sum{padding:5px 8px;min-width:36px}
.reg button{width:100%;height:30px;border:0;background:none;cursor:pointer;font-weight:700;font-size:13px;padding:0}
.reg .c-P{background:var(--ok-bg);color:var(--ok)}
.reg .c-A{background:var(--bad-bg);color:var(--bad)}
.reg .c-O{background:var(--warn-bg);color:var(--warn)}
.reg .c-L{background:var(--info-bg);color:var(--info)}
.reg .fut{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 4px;max-width:440px;margin:0 auto}
.cal .dow{font-size:14px;color:var(--mute);text-align:center;padding:2px 0 4px}
.cal span.blank{display:block}
.cal button{width:100%;max-width:46px;margin:0 auto;aspect-ratio:1/1;min-height:0;padding:0;border-radius:50%;border:3px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer}
.cal .c-P{border-color:var(--ok);color:var(--ok)}
.cal .c-A{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.cal .c-O{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.cal .c-L{border-color:var(--info);color:var(--info);background:var(--info-bg)}
.cal .fut{cursor:default}
.cal .today{outline:2px dashed var(--warn);outline-offset:2px;font-weight:700}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calnav .btn{min-width:44px;font-size:20px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 8px;text-align:center}
.stat b{display:block;font-size:28px;line-height:1.2}
.stat span{font-size:14px;color:var(--mute)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.info b{color:var(--info)}
.feed button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 0;cursor:pointer;border-top:1px solid var(--line)}
.feed button:first-child{border-top:0;padding-top:0}
.feed .unread{font-weight:600}
.feed .unread:before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;background:var(--bad);border-radius:50%}
.feed-day{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:12px 0 6px;border-top:2px solid var(--line);margin-top:10px}
.feed-day:first-child{border-top:0;margin-top:0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:15.5px}
details>form,details>div{margin-top:10px}
.tl{margin:8px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line);list-style:none}
.tl li{margin-bottom:8px;font-size:15px}
.tl li span{color:var(--mute);font-size:13px;display:block}
.empty{text-align:center;color:var(--mute);padding:22px 0;font-size:15.5px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.linkbtn:hover{color:var(--pri)}
.mlist button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;cursor:pointer;font-size:15.5px}
.mlist button:first-child{border-top:0}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;max-width:90vw;display:none;z-index:100;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.outpass-card{background:#fff;color:#07162B;border:2px solid #0B2F6B;border-radius:12px;padding:26px;max-width:660px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:15.5px}
.outpass-hdr{text-align:center;border-bottom:2px solid #0B2F6B;padding-bottom:14px;margin-bottom:18px}
.outpass-hdr h2{color:#0B2F6B;font-size:22px;font-weight:700}
.outpass-num{background:#E6ECF6;color:#0B2F6B;display:inline-block;padding:5px 14px;border-radius:6px;font-weight:700;font-size:15px;margin-top:8px}
.outpass-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:15px;margin-bottom:18px}
.outpass-grid b{color:#07162B}
.outpass-ver{background:#F0F3F8;border:1px solid #D5DCE6;border-radius:8px;padding:14px;margin-bottom:18px;font-size:14px}
.outpass-sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;padding-top:14px;border-top:1px dashed #D5DCE6}
.sig-img{max-height:52px;max-width:190px;display:block}
#sigpad{border:1px dashed var(--line);border-radius:8px;background:var(--surf);cursor:crosshair;touch-action:none;display:block;margin-bottom:8px}
.poll-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:12px;background:var(--soft);font-size:15.5px}
.poll-prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.poll-prog-fill{height:100%;background:var(--pri)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:18px}
.opt-card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.opt-card:hover{border-color:var(--pri)}
.opt-card .ico{width:26px;height:26px;color:var(--pri);margin-top:2px}
.opt-card b{display:block;font-size:17px;color:var(--ink);margin-bottom:3px}
.opt-card span{display:block;font-size:13.5px;color:var(--mute);line-height:1.4}

nav.bottom{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px;padding-bottom:96px}
  nav.side{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.bottom button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:5px 0;cursor:pointer;color:var(--mute);font-size:12px;min-height:50px}
  nav.bottom button[aria-current="page"]{color:var(--pri);font-weight:700}
  nav.bottom .ico{width:24px;height:24px}
  nav.bottom .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;line-height:18px;font-size:11px;padding:0 5px;background:var(--bad)!important;color:#fff!important}
  .scrim{display:block;position:fixed;inset:0;z-index:25;border:0;background:rgba(8,16,28,.5);width:100%;padding:0;cursor:default}
  .sheet{display:flex;flex-direction:column;position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:80vh;overflow-y:auto}
  .sheet button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 12px;border-radius:8px;text-align:left;font-size:14px;cursor:pointer;color:var(--ink)}
  .sheet button:hover{background:var(--soft)}
  .sheet .badge{margin-left:auto}
  .top{padding:10px 14px}
  .strip{padding:8px 14px 12px;gap:6px 16px}
  #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .seg{width:100%}.seg-b{flex:1}
  .quick{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}

.login-wrap{min-height:100vh;max-width:1100px;margin:auto;padding:48px 24px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.login-brand{font-size:30px;font-weight:700;color:var(--pri)}
.login-kicker{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--mute);margin:12px 0}
.login-intro h1{font-size:44px;margin:34px 0 18px;line-height:1.15}
.login-intro>p:not(.login-kicker){color:var(--mute)}
.login-features{display:grid;gap:12px;margin:30px 0;color:var(--pri);font-weight:600;font-size:15px}
.login-features span:before{content:'✓';margin-right:10px}
.login-disclaimer{font-size:12px;margin-top:44px}
.login-card{background:white;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 12px 45px #14202f0a}
.login-card h2{font-size:28px;margin-bottom:10px}.login-tabs{display:flex;gap:10px;margin:26px 0}.login-tabs .btn{flex:1}
.login-demo{background:var(--soft);padding:16px;border-radius:10px;margin-top:24px;font-size:14px;line-height:1.8}.login-demo b{display:block;margin-bottom:5px}
.login-submit{width:100%}.login-error{color:var(--bad);font-size:14px;margin-bottom:12px}
@media(max-width:760px){.login-wrap{grid-template-columns:1fr;gap:26px;padding:24px 16px}.login-intro h1{font-size:32px;margin:18px 0 12px}.login-features,.login-disclaimer{display:none}.login-card{padding:24px}.login-brand{font-size:25px}}


.lf-photo{display:block;width:100%;max-width:360px;max-height:280px;object-fit:contain;background:var(--soft);border:1px solid var(--line);border-radius:10px;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const lt=d=>ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const TODAY=()=>ymd(new Date());
const NOW=()=>lt(new Date());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const fDate=s=>pd(s.slice(0,10)).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fDay=s=>pd(s.slice(0,10)).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const fTime=s=>new Date(s).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});

/* ---------- attendance logic ---------- */
const ATT={P:['Present','ok'],A:['Absent','bad'],O:['Outing','warn'],L:['Leave','info']};
const isOut=r=>DB.outings.find(o=>o.roll===r&&o.status==='out');
function sOf(roll,date){const v=(DB.att[date]||{})[roll];if(v)return v;if(date===TODAY()&&isOut(roll))return 'O';return null}
function stats(roll,ym){
  const a=ym.split('-').map(Number),n=new Date(a[0],a[1],0).getDate(),c={P:0,A:0,O:0,L:0};
  for(let i=1;i<=n;i++){const k=ym+'-'+pad(i);if(k>TODAY())break;const v=sOf(roll,k);if(v)c[v]++}
  const den=c.P+c.A+c.O;c.pct=den?Math.round(c.P*100/den):null;return c;
}
const overdueMin=o=>Math.round((Date.now()-new Date(o.expectedIn).getTime())/60000);
const isLate=o=>o.inAt&&new Date(o.inAt)>new Date(o.expectedIn);
function where(roll){
  const o=isOut(roll);
  if(o){const od=overdueMin(o);return od>0?{t:'Outside the hostel, '+od+' min late',tone:'bad',d:'Left at '+fTime(o.outAt)+', was due back by '+fTime(o.expectedIn)}:{t:'Outside the hostel on an outing',tone:'warn',d:'Left at '+fTime(o.outAt)+', due back by '+fTime(o.expectedIn)}}
  if((DB.att[TODAY()]||{})[roll]==='L')return {t:'On leave today',tone:'info',d:'Marked as leave in today\'s register'};
  const ap=DB.outings.find(x=>x.roll===roll&&x.status==='approved'&&x.expectedOut.slice(0,10)===TODAY());
  return {t:'Inside the hostel',tone:'ok',d:ap?'Outing approved for '+fTime(ap.expectedOut)+', not left yet':'No outing recorded at the gate'};
}

function sundayQuotaUsed(roll,monthYm){
  const outs=DB.outings.filter(o=>{
    if(o.roll!==roll)return false;
    if(o.type!=='sunday')return false;
    if(o.status==='rejected'||o.status==='cancelled')return false;
    const dt=(o.expectedOut||'').slice(0,7);
    return dt===monthYm;
  });
  return outs.length;
}

const pill=(t,tone)=>'<span class="pill p-'+(tone||'info')+'">'+esc(t)+'</span>';
const attPill=v=>v?pill(ATT[v][0],ATT[v][1]):pill('Not marked','info');
const head=(t,s)=>'<div class="head"><h1>'+esc(t)+'</h1>'+(s?'<p>'+esc(s)+'</p>':'')+'</div>';
const empty=t=>'<p class="empty">'+esc(t)+'</p>';
const field=(l,inner)=>'<label class="field"><span>'+esc(l)+'</span>'+inner+'</label>';
const opts=(arr,sel)=>arr.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('');
function outStatus(o){
  if(o.status==='pending')return pill('Waiting for warden','warn');
  if(o.status==='verifying')return pill('Warden is verifying','warn');
  if(o.status==='approved')return pill('Approved & Pass issued','ok');
  if(o.status==='rejected')return pill('Rejected','bad');
  if(o.status==='cancelled')return pill('Cancelled','info');
  if(o.status==='out')return overdueMin(o)>0?pill('Overdue','bad'):pill('Out','pri');
  return isLate(o)?pill('Returned late','warn'):pill('Returned on time','ok');
}

function unreadFeedCount(){
  const u=who();
  return DB.feedItems.filter(f=>!f.readBy||!f.readBy.includes(u)).length;
}

function counts(){
  const c={};const w=isW(),r=SESSION?SESSION.roll:'';
  if(w){
    const unm=DB.students.filter(s=>!sOf(s.roll,TODAY())).length;
    c.attendance=DB.rollcall[TODAY()]?0:unm;
    c.verification=DB.outings.filter(o=>o.status==='pending'||o.status==='verifying').length;
    c.outings=c.verification+DB.outings.filter(o=>o.status==='out'&&overdueMin(o)>0).length;
    c.issues=DB.issues.filter(i=>i.status==='reported').length;
    c.medical=DB.emergencies.filter(e=>e.status!=='resolved').length;
    c.laundry=DB.laundry.filter(l=>l.status==='given').length;
    c.mess=DB.polls.filter(p=>p.status==='open').length;
    c.feed=unreadFeedCount();
  }else if(SESSION){
    c.outings=DB.outings.filter(o=>o.roll===r&&(o.status==='out'||o.status==='approved')).length;
    c.verification=c.outings;
    c.issues=DB.issues.filter(i=>i.roll===r&&i.status==='fixed').length;
    c.laundry=DB.laundry.filter(l=>l.roll===r&&l.status==='ready').length;
    c.medical=DB.emergencies.filter(e=>e.roll===r&&e.status!=='resolved').length;
    c.mess=DB.polls.filter(p=>p.status==='open'&&(!p.votes||!p.votes[r])).length;
    c.feed=unreadFeedCount();
  }
  return c;
}

function renderPollCard(p,w,m){
  const totStu=DB.students.length;
  const votesObj=p.votes||{};
  const voters=Object.keys(votesObj);
  const respCount=voters.length;
  const respPct=totStu?Math.round(respCount*100/totStu):0;
  const counts=p.options.map((_,idx)=>voters.filter(v=>votesObj[v].opt===idx).length);
  const myVote=m&&votesObj[m.roll]?votesObj[m.roll]:null;

  let h='<div class="poll-box"><div class="item"><div class="main"><b>'+esc(p.title)+'</b> <span class="sub">'+(p.day&&p.meal?p.day+' '+p.meal:'General')+'</span>'
   +'<div class="line">'+pill(p.status==='open'?'Open for voting':'Closed',p.status==='open'?'ok':'info')+' &bull; <b>'+respCount+' of '+totStu+'</b> students voted ('+respPct+'%)</div>'
   +'</div>';

  if(w){
    h+='<div class="acts">';
    if(p.status==='open'){
      h+='<button class="btn small" data-act="poll-toggle-status" data-id="'+p.id+'" data-to="closed">Close Poll</button>';
    } else {
      h+='<button class="btn small primary" data-act="poll-toggle-status" data-id="'+p.id+'" data-to="open">Reopen Poll</button>';
    }
    h+='<button class="btn small danger" data-act="poll-delete" data-id="'+p.id+'">Delete</button>';
    h+='</div>';
  }
  h+='</div>';

  if(!w){
    if(p.status==='open'){
      h+='<div style="margin-top:12px"><p class="sub" style="margin-bottom:6px">Tap an option to cast or update your vote:</p>';
      p.options.forEach((opt,idx)=>{
        const isSelected=myVote&&myVote.opt===idx;
        const optVotes=counts[idx];
        const optPct=respCount?Math.round(optVotes*100/respCount):0;
        h+='<div class="poll-opt"><button type="button" class="poll-opt-btn'+(isSelected?' voted':'')+'" data-act="poll-vote" data-id="'+p.id+'" data-opt="'+idx+'">'
          +'<span>'+(isSelected?ic('check')+' ':'')+esc(opt)+'</span>'
          +'<span>'+optVotes+' ('+optPct+'%)</span>'
          +'</button><div class="poll-prog"><div class="poll-prog-fill" style="width:'+optPct+'%"></div></div></div>';
      });
      h+='<form data-form="poll-comment" data-id="'+p.id+'" style="margin-top:8px;display:flex;gap:8px">'
        +'<input name="comment" value="'+esc(myVote?myVote.comment:'')+'" placeholder="Optional comment for the warden" style="min-height:36px;padding:6px 10px">'
        +'<button class="btn small primary" style="flex:none">Save Comment</button>'
        +'</form>';
      h+='</div>';
    } else {
      h+='<p class="note">This poll is closed. Final results:</p>';
      p.options.forEach((opt,idx)=>{
        const optVotes=counts[idx];
        const optPct=respCount?Math.round(optVotes*100/respCount):0;
        h+='<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+esc(opt)+'</span><b>'+optVotes+' ('+optPct+'%)</b></div><div class="poll-prog"><div class="poll-prog-fill" style="width:'+optPct+'%"></div></div></div>';
      });
    }
  } else {
    h+='<div style="margin-top:12px">';
    p.options.forEach((opt,idx)=>{
      const optVotes=counts[idx];
      const optPct=respCount?Math.round(optVotes*100/respCount):0;
      h+='<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><span><b>'+esc(opt)+'</b></span><span>'+optVotes+' votes ('+optPct+'%)</span></div><div class="poll-prog"><div class="poll-prog-fill" style="width:'+optPct+'%"></div></div></div>';
    });
    const comments=voters.filter(v=>votesObj[v].comment).map(v=>({voter:stu(v),comment:votesObj[v].comment,optName:p.options[votesObj[v].opt]}));
    h+='<details style="margin-top:12px"><summary>Student Comments ('+comments.length+')</summary>';
    if(!comments.length){
      h+=empty('No student comments submitted.');
    } else {
      h+='<div class="list" style="margin-top:6px">'+comments.map(c=>'<div><b>'+esc(c.voter.name)+'</b> <span class="sub">Room '+esc(c.voter.room)+' ('+esc(c.optName)+')</span><div class="line">&ldquo;'+esc(c.comment)+'&rdquo;</div></div>').join('')+'</div>';
    }
    h+='</details></div>';
  }

  h+='</div>';
  return h;
}

function allStats(roll){
  const t=TODAY(),c={P:0,A:0,O:0,L:0};
  Object.keys(DB.att).concat([t]).filter((k,i,r)=>r.indexOf(k)===i&&k<=t).forEach(k=>{const v=sOf(roll,k);if(v)c[v]++});
  const den=c.P+c.A+c.O;return {c,tot:den+c.L,pct:den?Math.round(c.P*1000/den)/10:null};
}

function attW(){
  let h=head('Attendance & Monthly Exports','Night roll call shortcuts, and full monthly sheet exports in PDF (landscape) and CSV.');
  h+='<div class="tabs"><button class="tab" aria-pressed="'+(S.attTab==='roll')+'" data-act="att-tab" data-v="roll">Night Roll Call</button><button class="tab" aria-pressed="'+(S.attTab==='reg')+'" data-act="att-tab" data-v="reg">Monthly Register & Exports</button></div>';
  return h+(S.attTab==='roll'?rollcallV():registerV());
}

function roster(){
  const q=S.attQ.trim().toLowerCase();
  return DB.students.filter(s=>(S.attHostel==='all'||s.hostel===S.attHostel)&&(!q||s.name.toLowerCase().includes(q)||s.roll.toLowerCase().includes(q)||s.room.toLowerCase().includes(q)))
   .sort((a,b)=>a.room.localeCompare(b.room,'en',{numeric:true})||a.name.localeCompare(b.name));
}

function rollRows(){
  const d=S.attDate,l=roster();
  if(!l.length)return empty('No student matches this filter.');
  return '<div class="list">'+l.map(s=>{
    const v=sOf(s.roll,d);
    return '<div class="rc-row"><div class="who"><button class="linkbtn" data-act="lookup" data-roll="'+s.roll+'">'+esc(s.name)+'</button><div class="sub"><span>Room '+esc(s.room)+'</span><span>'+esc(s.roll)+'</span></div></div><div class="seg" role="group" aria-label="Status for '+esc(s.name)+'">'
     +['P','A','O','L'].map(k=>'<button type="button" class="seg-b s-'+k+(v===k?' on':'')+'" aria-pressed="'+(v===k)+'" data-act="mark" data-roll="'+s.roll+'" data-date="'+d+'" data-st="'+k+'" data-fk="rc-'+s.roll+'-'+k+'">'+ATT[k][0]+'</button>').join('')+'</div></div>';
  }).join('')+'</div>';
}

function rollcallV(){
  const d=S.attDate,all=DB.students,c={P:0,A:0,O:0,L:0,N:0};
  all.forEach(s=>c[sOf(s.roll,d)||'N']++);
  const fin=DB.rollcall[d];
  let h='<div class="tools">'+field('Date','<input type="date" value="'+d+'" max="'+TODAY()+'" min="'+ymd(plus(new Date(),-45))+'" data-set="attDate">')
   +field('Hostel','<select data-set="attHostel"><option value="all">All hostels</option>'+['Hostel A','Hostel B'].map(x=>'<option'+(S.attHostel===x?' selected':'')+'>'+x+'</option>').join('')+'</select>')
   +field('Search','<input type="search" id="attq" value="'+esc(S.attQ)+'" placeholder="Name, room or roll no." data-live="attQ">')+'</div>';
  h+='<div class="chips"><span class="chip">Present <b>'+c.P+'</b></span><span class="chip">Absent <b>'+c.A+'</b></span><span class="chip">Outing <b>'+c.O+'</b></span><span class="chip">Leave <b>'+c.L+'</b></span><span class="chip">Not marked <b>'+c.N+'</b></span></div>';

  h+='<div class="panel"><div class="btnrow" style="margin-bottom:12px">'
   +'<button class="btn primary" data-act="mark-all-present" data-date="'+d+'">'+ic('check')+' Mark Everyone Else Present</button>'
   +'<button class="btn" data-act="mark-approved-out" data-date="'+d+'">'+ic('outings')+' Mark Approved Outings as Out</button>'
   +'<button class="btn" data-act="finish" data-date="'+d+'"'+(c.N?' disabled':'')+'>'+(fin?'Update Roll Call':'Finish Roll Call')+'</button>'
   +(c.A?'<button class="btn" data-act="copy-abs" data-date="'+d+'">Copy Absentee List</button>':'')+'</div>'
   +(c.N?'<p class="note" style="margin:-4px 0 12px">'+c.N+' student'+(c.N>1?'s are':' is')+' not marked yet.</p>':'')
   +(fin?'<p class="note" style="margin:-4px 0 12px">Roll call completed at '+fTime(fin.at)+'.</p>':'')
   +'<div id="rolllist">'+rollRows()+'</div></div>';
  return h;
}

function registerV(){
  const ym=S.attMonth,a=ym.split('-').map(Number),n=new Date(a[0],a[1],0).getDate(),list=roster();
  const lab=new Date(a[0],a[1]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  let h='<div class="tools"><div class="btnrow"><button class="btn" data-act="month" data-d="-1">Previous</button><b style="min-width:130px;text-align:center">'+lab+'</b><button class="btn" data-act="month" data-d="1"'+(ym>=TODAY().slice(0,7)?' disabled':'')+'>Next</button></div>'
   +field('Hostel','<select data-set="attHostel"><option value="all">All hostels</option>'+['Hostel A','Hostel B'].map(x=>'<option'+(S.attHostel===x?' selected':'')+'>'+x+'</option>').join('')+'</select>')
   +'<div class="btnrow" style="margin-left:auto">'
   +'<button class="btn primary" data-act="export-hostel-pdf" data-month="'+ym+'">'+ic('download')+' Download Full Month PDF (Landscape)</button>'
   +'<button class="btn" data-act="export-hostel-csv" data-month="'+ym+'">'+ic('download')+' Download CSV (Phone compatible)</button>'
   +'</div>'
   +'</div>';

  let th='<tr><th class="left">Roll No</th><th class="left">Student Name</th><th>Room</th>';
  for(let i=1;i<=n;i++){const k=ym+'-'+pad(i);th+='<th class="'+(k===TODAY()?'today':'')+'">'+i+'</th>'}
  th+='<th>P</th><th>A</th><th>O</th><th>L</th><th>%</th></tr>';
  const rows=list.map(s=>{
    let r='<tr><td class="left">'+esc(s.roll)+'</td><td class="left"><button class="linkbtn" data-act="lookup" data-roll="'+s.roll+'"><b>'+esc(s.name)+'</b></button></td><td>'+esc(s.room)+'</td>';
    for(let i=1;i<=n;i++){
      const k=ym+'-'+pad(i);
      if(k>TODAY()){r+='<td class="fut"></td>';continue}
      const v=sOf(s.roll,k);
      r+='<td class="'+(v?'c-'+v:'')+'"><button data-act="cycle" data-roll="'+s.roll+'" data-date="'+k+'" data-fk="reg-'+s.roll+'-'+i+'">'+(v||'')+'</button></td>';
    }
    const st=stats(s.roll,ym);
    return r+'<td class="sum">'+st.P+'</td><td class="sum">'+st.A+'</td><td class="sum">'+st.O+'</td><td class="sum">'+st.L+'</td><td class="sum"><b>'+(st.pct==null?'-':st.pct+'%')+'</b></td></tr>';
  }).join('');

  h+='<div class="scroll"><table class="reg"><thead>'+th+'</thead><tbody>'+rows+'</tbody></table></div>';
  return h;
}

function attS(){
  const m=me(),w=where(m.roll),t=TODAY(),ym=S.attMonth,a=ym.split('-').map(Number);
  const n=new Date(a[0],a[1],0).getDate(),off=new Date(a[0],a[1]-1,1).getDay();
  const lab=new Date(a[0],a[1]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const c={P:0,A:0,O:0,L:0};
  Object.keys(DB.att).concat([t]).filter((k,i,r)=>r.indexOf(k)===i&&k<=t).forEach(k=>{const v=sOf(m.roll,k);if(v)c[v]++});
  const den=c.P+c.A+c.O,pct=den?Math.round(c.P*1000/den)/10:null,tot=den+c.L,C=2*Math.PI*52;
  const tone=pct==null?'var(--line)':pct>=75?'var(--ok)':'var(--bad)';
  const fin=DB.rollcall[t],v0=sOf(m.roll,t);

  let h=head('My Attendance Record');
  h+='<div class="panel hero h-'+w.tone+'"><div class="item"><div class="main"><div class="big">'+esc(w.t)+'</div><div class="line">'+esc(w.d)+'</div></div><div>'+attPill(v0)+'<div class="sub" style="margin-top:4px;text-align:right">'+(fin?'Roll call done at '+fTime(fin.at):'Tonight\'s roll call pending')+'</div></div></div></div>';

  h+='<div class="panel"><div class="item"><h2>Overall Statistics</h2><button class="btn small primary" data-act="download-student-att-pdf" data-roll="'+m.roll+'" data-month="'+ym+'">'+ic('download')+' Download '+lab+' Report (PDF)</button></div>'
   +'<div class="ringwrap" style="margin-top:10px"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Overall attendance '+(pct==null?'not available':pct+' percent')+'"><circle cx="60" cy="60" r="52" fill="none" stroke-width="11" style="stroke:var(--info-bg)"/>'
   +(pct==null?'':'<circle cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'" style="stroke:'+tone+'"/>')
   +'<text x="60" y="64" text-anchor="middle" style="fill:var(--ink);font:700 21px var(--font)">'+(pct==null?'No data':pct+'%')+'</text><text x="60" y="80" text-anchor="middle" style="fill:var(--mute);font:400 9px var(--font)">Overall</text></svg></div>'
   +'<p class="note" style="text-align:center">Nights present out of nights marked. Leave days are not counted. Below 75% shows in red.</p></div>';

  h+='<div class="stats"><div class="stat ok"><b>'+c.P+'</b><span>Present</span></div><div class="stat bad"><b>'+c.A+'</b><span>Absent</span></div><div class="stat warn"><b>'+c.O+'</b><span>Outing</span></div><div class="stat info"><b>'+c.L+'</b><span>Leave</span></div><div class="stat"><b>'+tot+'</b><span>Total Marked</span></div></div>';

  h+='<div class="panel"><div class="calnav"><button class="btn small" data-act="month" data-d="-1">&#8249;</button><h2>'+lab+'</h2><button class="btn small" data-act="month" data-d="1"'+(ym>=t.slice(0,7)?' disabled':'')+'>&#8250;</button></div>'
   +'<div class="cal" style="margin-top:12px">'
   +['S','M','T','W','T','F','S'].map(x=>'<div class="dow">'+x+'</div>').join('')+'<span class="blank"></span>'.repeat(off);
  for(let i=1;i<=n;i++){
    const k=ym+'-'+pad(i),f=k>t,s=f?null:sOf(m.roll,k);
    h+='<button class="'+(f?'fut':s?'c-'+s:'')+(k===t?' today':'')+(S.selDay===k?' sel':'')+'" '+(f?'disabled':'data-act="day" data-date="'+k+'"')+'>'+i+'</button>';
  }
  h+='</div>';

  if(S.selDay&&S.selDay.slice(0,7)===ym){
    const s=sOf(m.roll,S.selDay);
    h+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><h3>'+fDay(S.selDay)+'</h3><p style="margin-top:4px">'+attPill(s)+'</p>'
     +((s==='A'||!s)?'<div class="btnrow" style="margin-top:8px"><button class="btn small" data-act="query-day" data-date="'+S.selDay+'">Ask warden to check this day</button></div>':'')+'</div>';
  }
  h+='</div>';

  return h;
}

const ISS={reported:['Reported','warn'],assigned:['In Progress','info'],visit:['Visit Scheduled','pri'],fixed:['Fixed','ok'],closed:['Closed','ok']};
const tlist=l=>'<ul class="tl">'+(l||[]).map(x=>'<li>'+esc(x.text||'')+'<span>'+fDT(x.at)+'</span></li>').join('')+'</ul>';

  const w=isW(),m=me();

  if(S.issueFilter==='open')list=list.filter(i=>i.status!=='closed');
  list=list.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  let h=head('Repairs & Maintenance Tracker','Report maintenance problems with location and description. Warden is alerted immediately and updates status.');

     +field('Photo (optional)','<input type="file" name="photo" accept="image/*">')

  } else {
    h+='<div class="panel"><div class="item"><h2>Log a Maintenance Problem</h2><button class="btn small" data-act="toggle-warden-issue">+ Log New Repair</button></div>'
     +(S.wardenIssueOpen?'<form data-form="issue-warden-new" style="margin-top:12px"><div class="grid2">'
       +field('Student / Room','<select name="roll">'+DB.students.slice().sort((a,b)=>a.room.localeCompare(b.room,'en',{numeric:true})).map(s=>'<option value="'+s.roll+'">'+esc(s.name)+' (Room '+esc(s.room)+')</option>').join('')+'</select>')
       +field('Issue Category','<select name="cat">'+opts(['Electrical','Plumbing','Carpentry','Internet','Cleaning','Other'])+'</select>')
       +'</div><div class="grid2">'
       +field('Location / Room','<input name="where" required placeholder="e.g. Washroom 2nd floor / Room A-105">')
       +field('Urgency Level','<select name="pri">'+opts(['Normal','Urgent','Low'])+'</select>')
       +'</div>'
       +field('Description of the problem','<textarea name="text" required placeholder="Detailed description..."></textarea>')
       +'<button class="btn primary" style="margin-top:6px">Log Repair</button></form>':'')
     +'</div>';
  }

  h+='<div class="tools">'+field('Filter Repairs','<select data-set="issueFilter"><option value="open"'+(S.issueFilter==='open'?' selected':'')+'>Open / In Progress</option><option value="all"'+(S.issueFilter==='all'?' selected':'')+'>All Repairs</option></select>')+'</div>';

  h+='<div class="panel">'+(list.length?'<div class="list">'+list.map(i=>{
    const s=stu(i.roll),p=ISS[i.status]||['Reported','warn'];
    return '<div><div class="item"><div class="main"><b>'+esc(i.cat)+'</b> at <b>'+esc(i.where)+'</b>'+(w?' <span class="sub">by '+esc(s.name)+' (Room '+esc(s.room)+')</span>':'')
     +'<div class="line">'+esc(i.text)+'</div>'
     +'<div class="line">'+(i.staff?'Assigned to: <b>'+esc(i.staff)+'</b>':'Unassigned')+(i.visit?', Visit: '+fDT(i.visit):'')+'</div>'
     +(i.photo?'<img class="photo" src="'+i.photo+'" alt="Photo of the problem">':'')+'</div>'
     +'<div class="acts">'+pill(i.pri,i.pri==='Urgent'?'bad':'info')+pill(p[0],p[1])+'</div></div>'
     +'<details><summary>Status Timeline ('+i.log.length+' updates)</summary>'+tlist(i.log)+'</details>'
     +(w&&i.status!=='closed'?'<div style="margin-top:10px;padding:12px;background:var(--soft);border-radius:8px">'
        +'<div class="btnrow" style="margin-bottom:10px">'
        +(i.status!=='assigned'?'<button class="btn small" data-act="repair-status" data-id="'+i.id+'" data-st="assigned">Mark In Progress</button>':'')
        +(i.status!=='fixed'?'<button class="btn small primary" data-act="repair-status" data-id="'+i.id+'" data-st="fixed">Mark Fixed</button>':'')
        +(i.status!=='reported'?'<button class="btn small" data-act="repair-status" data-id="'+i.id+'" data-st="reported">Reopen to Reported</button>':'')
        +'</div>'
        +'<form data-form="issue-assign" data-id="'+i.id+'"><div class="grid2">'
        +field('Assign Maintenance Staff','<select name="staff"><option value="">Select staff</option>'+DB.staff.map(x=>{const v=x.name+' ('+x.role.toLowerCase()+')';return '<option'+(i.staff===v?' selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>')

/* ---------- 8. LAUNDRY & MACHINE SLOTS ---------- */
const LS={given:['Given to dhobi','info'],washing:['Washing','warn'],ready:['Ready to collect','ok'],collected:['Collected','info']};
function laundryV(){
  const w=isW(),m=me();
  let list=DB.laundry.filter(l=>w||(m&&l.roll===m.roll)).slice().sort((a,b)=>b.at.localeCompare(a.at));
  if(w)list=list.filter(l=>l.status!=='collected').concat(list.filter(l=>l.status==='collected').slice(0,8));
  let h=head('Laundry & Washing Machine Booking','Track your clothes with the dhobi and reserve washing machine slots.');

  if(!w){
    h+='<div class="panel"><h2>Give Clothes to Dhobi</h2><form data-form="laundry-new"><div class="grid2">'+field('Number of items','<input type="number" name="items" min="1" max="60" required placeholder="e.g. 10">')+field('Bag number or identifier note','<input name="note" placeholder="e.g. Blue bag #12">')+'</div><button class="btn primary">Add to Dhobi Tracker</button></form></div>';
  } else {
    h+='<div class="panel"><div class="item"><h2>Record Laundry Intake</h2><button class="btn small" data-act="toggle-warden-laundry">+ Record Clothes Given</button></div>'
     +(S.wardenLauOpen?'<form data-form="laundry-warden-new" style="margin-top:12px"><div class="grid3">'
       +field('Student','<select name="roll">'+DB.students.slice().sort((a,b)=>a.room.localeCompare(b.room,'en',{numeric:true})).map(s=>'<option value="'+s.roll+'">'+esc(s.name)+' (Room '+esc(s.room)+')</option>').join('')+'</select>')
       +field('Items Count','<input type="number" name="items" min="1" max="60" required value="10">')
       +field('Bag Note','<input name="note" placeholder="Bag tag or mark">')
       +'</div><button class="btn primary">Record Intake</button></form>':'')
     +'</div>';
  }

  h+='<div class="panel"><h2>'+(w?'Dhobi Intake & Delivery Tracker':'My Laundry Status')+'</h2>'+(list.length?'<div class="list">'+list.map(l=>{
    const s=stu(l.roll),p=LS[l.status]||['Given','info'];let a='';
    if(w){
      if(l.status==='given')a='<button class="btn small" data-act="laundry-next" data-id="'+l.id+'" data-to="washing">Mark Washing</button><button class="btn small primary" data-act="laundry-next" data-id="'+l.id+'" data-to="ready">Mark Ready</button>';
      if(l.status==='washing')a='<button class="btn small primary" data-act="laundry-next" data-id="'+l.id+'" data-to="ready">Mark Ready</button>';
      if(l.status==='ready')a='<button class="btn small" data-act="laundry-next" data-id="'+l.id+'" data-to="collected">Mark Delivered</button>';
    } else if(l.status==='ready'){
      a='<button class="btn small primary" data-act="laundry-next" data-id="'+l.id+'" data-to="collected">I Collected It</button>';
    }
    return '<div><div class="item"><div class="main">'+(w?'<b>'+esc(s.name)+'</b> <span class="sub">Room '+esc(s.room)+' &bull; '+l.items+' items</span>':'<b>'+l.items+' items</b>')+'<div class="line">'+(l.note?'Tag: <b>'+esc(l.note)+'</b> &bull; ':'')+'Given '+fDT(l.at)+'</div></div><div class="acts">'+pill(p[0],p[1])+a+'</div></div><details><summary>Tracking History</summary>'+tlist(l.log)+'</details></div>'}).join('')+'</div>':empty('No laundry currently on record.'))+'</div>';

  const day=S.slotDay==='today'?TODAY():ymd(plus(new Date(),1)),nowH=new Date().getHours();
  const mySlot=!w&&m&&DB.slots.find(x=>x.roll===m.roll&&x.date===day);
  let rows='';
  for(let hh=6;hh<=21;hh++){
    rows+='<tr><th scope="row">'+hr12(hh)+'</th>'+[1,2].map(mc=>{
      const b=DB.slots.find(x=>x.date===day&&x.hour===hh&&x.machine===mc),past=day===TODAY()&&hh<nowH;
      if(b){const own=!w&&m&&b.roll===m.roll;return '<td>'+(own||w?'<button class="btn small'+(own?' primary':'')+'" data-act="slot-cancel" data-id="'+b.id+'" data-fk="sl-'+hh+'-'+mc+'">'+esc(own?'Yours, cancel':first(stu(b.roll).name)+', cancel')+'</button>':'<span class="sub">'+esc(first(stu(b.roll).name))+'</span>')+'</td>'}
      return '<td>'+(past?'<span class="sub">Passed</span>':w?'<span class="sub">Free</span>':'<button class="btn small" data-act="slot-book" data-hour="'+hh+'" data-machine="'+mc+'" data-fk="sl-'+hh+'-'+mc+'">Book</button>')+'</td>'}).join('')+'</tr>';
  }
  h+='<div class="panel"><div class="item"><h2>Washing Machine Slots (1 Hour Slots)</h2><div class="seg" role="group" aria-label="Day"><button class="seg-b s-P'+(S.slotDay==='today'?' on':'')+'" data-act="slot-day" data-v="today" aria-pressed="'+(S.slotDay==='today')+'">Today</button><button class="seg-b s-P'+(S.slotDay==='tomorrow'?' on':'')+'" data-act="slot-day" data-v="tomorrow" aria-pressed="'+(S.slotDay==='tomorrow')+'">Tomorrow</button></div></div>'
   +'<p class="note" style="margin:6px 0 10px">'+fDay(day)+'. One slot per student per day.'+(mySlot?' You booked '+hr12(mySlot.hour)+' on machine '+mySlot.machine+'.':'')+'</p>'
   +'<div class="scroll"><table class="slots"><thead><tr><th>Time</th><th>Machine 1</th><th>Machine 2</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  return h;
}

/* ---------- 9. LOST AND FOUND ---------- */
function lfV(){
  const w=isW(),m=me(),f=S.lfFilter;
  let list=DB.lf.slice().reverse();
  if(f==='lost'||f==='found')list=list.filter(x=>x.kind===f&&x.status!=='returned');
  else if(f==='returned')list=list.filter(x=>x.status==='returned');
  else list=list.filter(x=>x.status!=='returned');

  let h=head('Lost and Found','Post items you lost or found. Everyone is notified. Only the reporting student can close their report.');

  h+='<div class="panel"><h2>Post a Lost or Found Item</h2><form data-form="lf-new"><div class="grid2">'
   +field('I...','<select name="kind"><option value="lost">Lost an item</option><option value="found">Found an item</option></select>')
   +field('Item Name','<input name="item" required placeholder="e.g. Black Casio Calculator / Blue Keys">')
   +'</div>'

/* ---------- SIGNATURE PAD CANVAS ---------- */
function initSigPad(){
  const canvas=$('#sigpad');
  if(!canvas||!canvas.getContext)return;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#0B2F6B';
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  let drawing=false,prevX=0,prevY=0;

  const getPos=e=>{
    const rect=canvas.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return [cx-rect.left,cy-rect.top];
  };

  canvas.onmousedown=e=>{drawing=true;const[x,y]=getPos(e);prevX=x;prevY=y;e.preventDefault()};
  canvas.onmousemove=e=>{if(!drawing)return;const[x,y]=getPos(e);ctx.beginPath();ctx.moveTo(prevX,prevY);ctx.lineTo(x,y);ctx.stroke();prevX=x;prevY=y;e.preventDefault()};
  window.onmouseup=()=>{drawing=false};
  canvas.ontouchstart=e=>{drawing=true;const[x,y]=getPos(e);prevX=x;prevY=y;e.preventDefault()};
  canvas.ontouchmove=e=>{if(!drawing)return;const[x,y]=getPos(e);ctx.beginPath();ctx.moveTo(prevX,prevY);ctx.lineTo(x,y);ctx.stroke();prevX=x;prevY=y;e.preventDefault()};
  canvas.ontouchend=()=>{drawing=false};
}

const ACTS={

  'more':()=>{S.more=!S.more;render()},'more-close':()=>{S.more=false;render()},
  'logout':()=>{SESSION=null;Object.assign(S,INITIAL_STATE);render();scrollTo(0,0)},
  'lookup':d=>{S.lookRoll=d.roll;S.lookQ=d.roll;S.lookMonth=TODAY().slice(0,7);S.view='student';S.more=false;render();scrollTo(0,0)},
  'look-month':d=>{const a=S.lookMonth.split('-').map(Number),x=new Date(a[0],a[1]-1+Number(d.d),1),k=x.getFullYear()+'-'+pad(x.getMonth()+1);if(k<=TODAY().slice(0,7)){S.lookMonth=k;render()}},

  /* Attendance */
  'att-tab':d=>{S.attTab=d.v;render()},
  'mark':d=>{const a=DB.att[d.date]=DB.att[d.date]||{};if(a[d.roll]===d.st)delete a[d.roll];else a[d.roll]=d.st;commit()},
  'mark-all-present':d=>{const a=DB.att[d.date]=DB.att[d.date]||{};let n=0;DB.students.forEach(s=>{if(!sOf(s.roll,d.date)){a[s.roll]='P';n++}});toast(n?n+' students marked present.':'Everyone already marked.');commit()},
  'mark-approved-out':d=>{
    const a=DB.att[d.date]=DB.att[d.date]||{};
    let n=0;
    DB.outings.forEach(o=>{
      if((o.status==='approved'||o.status==='out'||o.status==='returned')&&o.expectedOut.slice(0,10)===d.date){
        if(a[o.roll]!=='O'){a[o.roll]='O';n++}
      }
    });
    toast(n?n+' students on approved outings marked Out.':'No unrecorded approved outings for today.');
    commit();
  },
  'finish':d=>{
    const a=DB.att[d.date]=DB.att[d.date]||{};
    DB.students.forEach(s=>{const v=sOf(s.roll,d.date);if(v&&!a[s.roll])a[s.roll]=v});

  if(roleButton){loginRole=roleButton.dataset.loginRole;render();return;}
  if(!SESSION)return;
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;

  const f=ACTS[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-lf-photo]')){
    const preview=t.form.querySelector('[data-lf-preview]'),file=t.files[0];
    preview.replaceChildren();
    const problem=lfPhotoError(file);
    if(problem){t.value='';preview.textContent=problem;return;}
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      if(t.files[0]!==file)return;
      const img=document.createElement('img');img.className='lf-photo';img.alt='Selected item photo preview';img.src=reader.result;
      const remove=document.createElement('button');remove.type='button';remove.className='btn small';remove.textContent='Remove photo';
      remove.onclick=()=>{t.value='';preview.replaceChildren();};
      preview.replaceChildren(img,remove);
    };
    reader.onerror=()=>{if(t.files[0]===file){t.value='';preview.textContent='Could not read this photo. Please choose another.';}};
    reader.readAsDataURL(file);return;
  }
  if(t.dataset&&t.dataset.set){
    let v=t.value;if(t.dataset.set==='attDate'&&(!v||v>TODAY()))v=TODAY();
    S[t.dataset.set]=v;render();
  }
  if(t.id==='outTypeSelect'){
    const wrap=$('#holNoticeWrap');
    if(wrap)wrap.style.display=t.value==='holiday'?'block':'none';
  }
  if(t.id==='chkMentor'||t.id==='chkParent'){
    const m=$('#chkMentor'),p=$('#chkParent'),btn=$('#btnApproveOuting');
    if(btn)btn.disabled=!(m&&m.checked&&p&&p.checked);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.live==='attQ'){
    S.attQ=t.value;const l=$('#rolllist');if(l)l.innerHTML=rollRows();
  }
});

    const g=n=>f.elements[n]?f.elements[n].value:'',m=me();
    const type=g('type')||'sunday';
    const outTime=g('out'),backTime=g('back');
    if(new Date(backTime)<=new Date(outTime))return toast('Return time must be after leaving time.');

    if(type==='sunday'){
      const outDay=pd(outTime.slice(0,10)).getDay();
      if(outDay!==0)return toast('Sunday outings can only be requested for Sundays.');
      const curMonth=outTime.slice(0,7);
      const used=sundayQuotaUsed(m.roll,curMonth);
      if(used>=3)return toast('Sunday outing quota full for '+curMonth+' (3 of 3 used).');
    }

    const o={
      id:uid(),roll:m.roll,type,purpose:type==='holiday'?'Holiday Outing':type==='sunday'?'Sunday Outing':'General Outing',
      place:g('place').trim(),reason:g('reason').trim(),phone:g('phone').trim(),
      expectedOut:outTime,expectedIn:backTime,status:'pending',
      createdAt:NOW(),mentorSpoke:false,parentSpoke:false,

  },
  'contacts-save':f=>{
    DB.contacts.forEach(c=>{c.name=f.elements['n-'+c.id].value.trim();c.phone=f.elements['p-'+c.id].value.trim()});
    DB.staff.forEach(c=>{c.name=f.elements['n-'+c.id].value.trim();c.phone=f.elements['p-'+c.id].value.trim()});
    S.infoEdit=false;toast('Contacts saved.');commit();
  },
  'rules':f=>{DB.rules.curfew=f.elements.curfew.value;DB.rules.rollcall=f.elements.rollcall.value;toast('Timings saved.');commit()},
  'hol-add':f=>{
    DB.holidays.push({id:uid(),date:f.elements.date.value,endDate:f.elements.endDate.value||f.elements.date.value,name:f.elements.name.value.trim(),note:f.elements.note.value.trim()});
    pushFeed('holidays','Holiday scheduled: '+f.elements.name.value.trim(),'Dates: '+f.elements.date.value+(f.elements.endDate.value?' to '+f.elements.endDate.value:''));
    toast('Holiday added.');commit();
  },
  'sos':f=>{
    const m=me();
    DB.emergencies.push({id:uid(),roll:m.roll,symptom:f.elements.symptom.value,note:f.elements.note.value.trim(),phone:m.phone,status:'new',at:NOW(),log:[{at:NOW(),text:'Alert sent'}]});
    pushFeed('medical','EMERGENCY MEDICAL ALERT: '+m.name,'Room '+m.room+', '+f.elements.symptom.value+'. Phone: '+m.phone);
    S.sosOpen=false;toast('Warden alerted immediately.');commit();
  },
  'lookup':f=>{
    const q=f.elements.roll.value.trim();S.lookQ=q;
    const hit=DB.students.find(x=>x.roll.toLowerCase()===q.toLowerCase()||x.name.toLowerCase()===q.toLowerCase()||x.room.toLowerCase()===q.toLowerCase());
    if(hit){S.lookRoll=hit.roll;S.lookQ=hit.roll;S.lookMonth=TODAY().slice(0,7)}
    else{
      const m=DB.students.filter(x=>x.roll.toLowerCase().includes(q.toLowerCase())||x.name.toLowerCase().includes(q.toLowerCase())||x.room.toLowerCase().includes(q.toLowerCase()));
      if(m.length===1){S.lookRoll=m[0].roll;S.lookQ=m[0].roll;S.lookMonth=TODAY().slice(0,7)}
      else S.lookRoll=null;
    }
    render();
  }
};

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='login'){
    const username=f.elements.username.value.trim();
    const password=f.elements.password.value;
    const expected=loginRole==='warden'?'Warden@123':'Student@123';
    if(username!==loginRole||password!==expected){
      $('#login-error').textContent='Incorrect credentials for the selected portal. Use the demo account shown below.';
      f.elements.password.focus();return;
    }
    Object.assign(S,INITIAL_STATE);
    SESSION={role:loginRole,roll:loginRole==='student'?(DB.demoRoll||DB.students[0].roll):null};
    render();scrollTo(0,0);return;
  }
  if(!SESSION)return;
  const fn=FORMS[f.dataset.form];if(fn)fn(f,e);
});

function lfPhotoError(file){
  if(!file)return '';
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))return 'Choose a JPG, PNG or WebP image.';
  if(file.size>8*1024*1024)return 'Please choose a photo smaller than 8 MB.';
  return '';
}
function compress(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

(function(){
  document.documentElement.dataset.theme='light';
  render();
  initSigPad();
  setInterval(()=>{
    if(SESSION&&['overview','outings','feed'].includes(S.view)&&!document.activeElement.closest('form')&&!document.activeElement.matches('input,select,textarea'))render();
  },60000);
})();
</script>
